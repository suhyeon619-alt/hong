<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

/* Layout: 한 화면 책자. 가로로 넘기는 페이지 트랙 + 하단 내비게이션 바. 쪽 내용이 길면 쪽 안에서만 세로 스크롤. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0B1120; --page:#151D31; --ink:#E9EDF5; --muted:#9BA7BE; --line:#2A3550; --soft:#1C2540;
  --c1:#E8694F; --c2:#3FB5A0; --c3:#7C8FE0; --on:#0B1120; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{

  --c1:#E8694F; --c2:#3FB5A0; --c3:#7C8FE0; --on:#0B1120; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--desk);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:15px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pc,var(--c1));outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;--pc:var(--ink)}
.app[data-part="1"]{--pc:var(--c1)}.app[data-part="2"]{--pc:var(--c2)}.app[data-part="3"]{--pc:var(--c3)}
.viewport{overflow:hidden;min-height:0}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.pg{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;padding:clamp(8px,2vw,22px) max(10px,env(safe-area-inset-left,0px)) clamp(8px,2vw,22px) max(10px,env(safe-area-inset-right,0px));overscroll-behavior:contain}
.pg>.sheet{max-width:1000px;margin:0 auto;min-height:100%;background:var(--page);box-shadow:var(--shadow);min-width:0}
.pad{padding:clamp(18px,4vw,44px)}
.p1{--pc:var(--c1)}.p2{--pc:var(--c2)}.p3{--pc:var(--c3)}

/* 표지 */
.cover{display:grid;grid-template-rows:auto 1fr auto;background:var(--ink)!important;color:#fff;padding:clamp(22px,5vw,52px);position:relative;overflow:hidden}
.cover .top{display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.18em;opacity:.85}
.cover h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,10vw,92px);line-height:1.08;margin:0;text-wrap:balance;align-self:center;padding:28px 0}
.cover h1 span{display:block;font-size:.32em;font-weight:500;letter-spacing:.05em;margin-top:16px;opacity:.92;line-height:1.5}
.cover .bottom{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;font-size:13.5px;border-top:1px solid rgba(255,255,255,.3);padding-top:14px}
.cover .bars{position:absolute;right:0;top:0;bottom:0;width:14px;display:grid;grid-template-rows:1fr 1fr 1fr}
.cover .bars i:nth-child(1){background:var(--c1)}.cover .bars i:nth-child(2){background:var(--c2)}.cover .bars i:nth-child(3){background:var(--c3)}
.cover .start{align-self:end}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover{background:#0F1730!important}}
:root[data-theme="dark"] .cover{background:#0F1730!important}

/* 차례 */
.toc h2{font-family:var(--display);font-size:28px;margin:0 0 4px}
.toc .sub{color:var(--muted);margin:0 0 20px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:grid;grid-template-columns:64px 1fr;gap:6px 16px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;cursor:pointer}
.toc li:last-child a{border-bottom:1px solid var(--line)}
.toc .n{font-family:var(--display);font-weight:900;font-size:32px;line-height:1;color:var(--pc)}
.toc b{font-family:var(--display);font-size:18px}
.toc .d{display:block;color:var(--muted);font-size:13.5px}
.toc a:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--pc)}
.guide{margin-top:20px;background:var(--soft);padding:14px 16px;font-size:13.5px;color:var(--muted)}
.guide b{color:var(--ink);display:block;margin-bottom:4px}
.guide .ln{display:block}
.divider .ln{display:block}
.divider p,.guide,.notice,.remark,.fest p{word-break:keep-all;overflow-wrap:break-word}
.notice p{margin:0}.notice p+p{margin-top:6px}

/* 파트 표지 (공통) */
.divider{background:var(--pc)!important;color:var(--on);padding:clamp(22px,5vw,52px);display:grid;grid-template-rows:auto 1fr auto}
.divider .lab{font-size:12px;letter-spacing:.2em;font-weight:700;opacity:.9}
.divider .num{font-family:var(--display);font-weight:900;font-size:clamp(90px,24vh,190px);line-height:.9;align-self:center;margin:8px 0;opacity:.95}
.divider h2{font-family:var(--display);font-size:clamp(26px,5.5vw,44px);line-height:1.2;margin:0;text-wrap:balance}
.divider p{margin:10px 0 0;max-width:54ch;opacity:.93}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips a{font-size:12.5px;text-decoration:none;border:1px solid currentColor;padding:3px 12px;border-radius:99px;cursor:pointer}
.chips a:hover{background:rgba(255,255,255,.2)}

/* 본문 쪽 공통 */
.crumb{font-size:11.5px;letter-spacing:.14em;font-weight:700;color:var(--pc);margin-bottom:6px}
.chap-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--pc);padding-bottom:8px;margin-bottom:18px;flex-wrap:wrap}
.chap-h h3{font-family:var(--display);font-size:28px;margin:0}
.chap-h em{font-style:normal;font-size:13px;color:var(--muted)}
.chap-h .idx{margin-left:auto;font-family:var(--display);font-weight:900;color:var(--pc);font-size:15px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.entry,.fest{border:1px solid var(--line);border-left:4px solid var(--pc);padding:13px 15px;min-width:0;background:var(--page)}
.entry .when{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:4px}
.kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--pc);border:1px solid var(--pc);padding:0 7px;border-radius:2px;margin-right:6px;vertical-align:1px}
.entry h4{display:inline;font-size:15.5px;margin:0;font-weight:700;overflow-wrap:anywhere}
.entry h4 a{text-decoration:none;border-bottom:1px solid var(--line)}
.entry h4 a:hover{border-color:var(--pc)}
.entry .where{color:var(--muted);font-size:13.5px;margin-top:4px}
.live{display:inline-block;font-size:11px;font-weight:700;color:var(--on);background:var(--pc);padding:0 7px;border-radius:2px;margin-left:6px;vertical-align:1px}
.remark{white-space:normal;margin-top:14px;background:var(--soft);padding:12px 14px;font-size:13.5px;color:var(--muted);border-left:3px solid var(--pc)}
.fest h4{font-family:var(--display);font-size:18px;margin:0}
.fest .org{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.fest .dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;margin-bottom:8px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fest .dates b{display:block;color:var(--pc);font-size:11px;letter-spacing:.1em}
.fest p{margin:0;font-size:13.5px}

/* QR 카드 */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.qcard{border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:112px 1fr;gap:14px;min-width:0;align-items:start}

.qr{width:112px;height:112px;background:#fff;padding:6px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.qr svg{width:100%;height:100%;display:block}
.qcard .kind{margin:0 0 6px}
.qcard h4{font-family:var(--display);font-size:17px;margin:0 0 4px}

.qcard .u a{color:var(--pc)}

.notice b{display:block;margin-bottom:4px;font-family:var(--display);font-size:15px}

/* 권역 이동 탭 · 차례 버튼 */
.tabrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tabs a{font-size:13px;font-weight:700;text-decoration:none;border:1.5px solid var(--pc);color:var(--pc);padding:4px 13px;border-radius:99px;cursor:pointer}
.tabs a:hover{background:var(--soft)}
.tabs a.on{background:var(--pc);color:var(--on);cursor:default}
.tocbtn{font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--soft);padding:5px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;margin-left:auto}
.tocbtn:hover{border-color:var(--pc)}
/* 판권 */
.colo{display:grid;gap:8px;align-content:end;font-size:13.5px;color:var(--muted)}
.colo b{color:var(--ink);font-family:var(--display);font-size:22px}

/* 하단 내비게이션 */
.bar{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--page);border-top:3px solid var(--pc);padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px))}
.bar button{border:1px solid var(--line);background:var(--soft);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:700;white-space:nowrap}
.bar button:hover:not(:disabled){border-color:var(--pc)}
.bar button.go{background:var(--pc);color:var(--on);border-color:var(--pc);min-width:48px}
.bar button:disabled{opacity:.35;cursor:default}
.mid{min-width:0;text-align:center}
.mid .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pc);transition:width .4s}
@media(max-width:520px){.bar .t{display:none}.bar button{padding:7px 11px}}
@media(min-width:700px){.remark{white-space:nowrap;font-size:clamp(11px,1.45vw,13.5px)}}
</style>

SITES.forEach(function(s,i){
  var el=document.getElementById('qr'+i);
  if(QRS[s.u]){el.innerHTML=QRS[s.u]}else{el.textContent='QR'}
});

var cur=0,N=pages.length;
var elLbl=document.getElementById('lbl'),elBar=document.getElementById('pbar'),bPrev=document.getElementById('bPrev'),bNext=document.getElementById('bNext');
function go(i,quiet){
  i=Math.max(0,Math.min(N-1,i));cur=i;
  track.style.transform='translateX(-'+(i*100)+'%)';
  var els=track.children;
  for(var k=0;k<els.length;k++){
    if(k===i){els[k].removeAttribute('inert');els[k].removeAttribute('aria-hidden');els[k].scrollTop=0}
    else{els[k].setAttribute('inert','');els[k].setAttribute('aria-hidden','true')}
  }
  app.setAttribute('data-part',pages[i].part);
  elLbl.textContent=pages[i].title+'  ·  '+(i+1)+' / '+N;
  elBar.style.width=((i+1)/N*100)+'%';
  bPrev.disabled=(i===0);bNext.disabled=(i===N-1);
}
function goId(id){if(id in idx)go(idx[id])}
bPrev.onclick=function(){go(cur-1)};
bNext.onclick=function(){go(cur+1)};
document.getElementById('bHome').onclick=function(){go(0)};
document.getElementById('bToc').onclick=function(){go(1)};
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-go]');
  if(t){e.preventDefault();goId(t.getAttribute('data-go'))}
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'){go(cur+1)}
  else if(e.key==='ArrowLeft'){go(cur-1)}
  else if(e.key==='Home'){go(0)}
  else if(e.key==='End'){go(N-1)}
});
var sx=0,sy=0,st=0;
var vp=document.getElementById('vp');
vp.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
vp.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<800){go(dx<0?cur+1:cur-1)}
},{passive:true});
go(0);
